    <stop offset="0" stop-color="#142d66"/>
    <stop offset=".52" stop-color="#081426"/>
    <stop offset="1" stop-color="#02050a"/>
  </radialGradient>
  <linearGradient id="skin" x1="0" x2="1">
    <stop stop-color="#5f6774"/><stop offset=".48" stop-color="#2c3440"/><stop offset="1" stop-color="#11161e"/>
